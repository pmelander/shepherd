[platformio]
; Holds the shared HMAC secret. Gitignored; see secret.ini.example.
extra_configs = secret.ini

[common]
; One definition of the cardputer flags, so secret.ini can extend rather
; than replace them. Overriding build_flags wholesale silently dropped
; -DCARDPUTER_ADV and built the StickC target instead.
cardputer_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCARDPUTER_ADV
    ; The board definition sets -DARDUINO_USB_MODE=1 but NOT
    ; ARDUINO_USB_CDC_ON_BOOT, so Serial lands on UART0 — which is not wired
    ; to the USB connector on this board. Every Serial.printf in the firmware,
    ; including the [ble] auth/pairing trace, goes nowhere. Turning CDC on at
    ; boot is what makes `pio device monitor` show anything at all, and this
    ; is a device whose interesting failures are all in BLE pairing.
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Serial instrumentation: a boot marker plus a 2s heartbeat carrying
    ; uptime and BLE connection state. On during firmware development,
    ; because not being able to see inside the device cost three wrong
    ; hypotheses in one session, and the heartbeat is what caught a silent
    ; 25x throughput bug in the host's MTU handling. Set to 0 when done.
    ;
    ; READING it is booby-trapped, and the trap costs a whole diagnosis.
    ; pyserial asserts DTR (and RTS) when it opens a port, and on this board
    ; that is the auto-reset line — so `serial.Serial("COM5", ...)` reboots
    ; the device the instant you look at it. The relay then logs a BLE "link
    ; lost" and reconnects, which reads exactly like a fault in the thing you
    ; were trying to observe. The tell is an uptime that always comes back at
    ; about fifteen seconds: that is not a device rebooting on its own
    ; schedule, it is one rebooting on yours.
    ;
    ; Deassert both lines BEFORE open():
    ;   p = serial.Serial(); p.port = "COM5"; p.baudrate = 115200
    ;   p.dtr = False; p.rts = False; p.open()
    ; `pio device monitor` does this for you and is safe.
    -DSHEPHERD_SERIAL_PROBE=1
    ; Upstream set -DBOARD_HAS_PSRAM here. Removed: esptool on the actual
    ; board reports "Features: WiFi, BLE, Embedded Flash 8MB (XMC)" with no
    ; PSRAM, on ESP32-S3 (QFN56) rev v0.2. The flag is simply wrong for ADV
    ; hardware. It is not fatal — the board boots with it set — but it makes
    ; the core attempt a PSRAM init that cannot succeed. See VENDOR.md.
    ; Uncomment to restore upstream's DisplayOnly + 6-digit-passkey pairing.
    ; Only do this alongside a central that can run a passkey ceremony;
    ; bleak on Windows cannot, so the default build is Just Works + bonding
    ; with an app-layer HMAC. See src/ble_bridge.cpp.
    ; -DSHEPHERD_BLE_PASSKEY

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/> -<bruno_main.cpp>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3   ; Cardputer is a StampS3-based device
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_flags = ${common.cardputer_flags}
; Bruno's main is excluded explicitly. The isolation has to go BOTH ways:
; bruno-core excludes main.cpp, and this must exclude bruno_main.cpp, or the
; two setup()/loop() pairs collide at link time. The build caught it, which is
; the argument for keeping both envs building in CI.
build_src_filter = +<*> +<buddies/> -<bruno_main.cpp>
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    m5stack/M5Cardputer @ ^1.0.3
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:bruno-core]
; Bruno: the desk companion, on an M5Stack Core Basic v2.7.
;
; Every choice here is measured rather than assumed - see the "Bruno's board"
; section of VENDOR.md for the probe output behind each one.
platform = espressif32
; NOT m5stack-core-esp32, and NOT m5stack-core-esp32-16M. The board reports
; 16MB flash in `mode:DIO` at `clock div:2`, so the first is wrong on size and
; mode and the second on mode and clock. m5stack-fire matches the flash but
; carries -DBOARD_HAS_PSRAM, which this board's own boot log disproves
; (`PSRAM ID read error: 0xffffffff`). m5stack-grey is the one that matches.
;
; Caveat it brings: m5stack-grey declares maximum_ram_size 532480, more DRAM
; than an ESP32 without PSRAM has, so PlatformIO's RAM percentage on this env
; reads LOWER than the truth. The cardputer-adv env declares 327680 and is
; honest. Do not compare the two percentages.
board = m5stack-grey
framework = arduino
monitor_speed = 115200
; No OTA, and no filesystem. The wav lives in flash as a const array, decided
; because the Cardputer's LittleFS is corrupt and an app-partition array
; cannot be broken by a filesystem that will not mount. 2MB of app is ample
; for ~1.3MB of firmware plus 64KB of sheep; the remaining 12MB of a 16MB
; chip is deliberately unused.
board_build.partitions = no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBRUNO_CORE
    ; Deliberately absent, each for a reason established on hardware:
    ;
    ;   -DBOARD_HAS_PSRAM         this board has none; the factory firmware's
    ;                             own boot says so.
    ;   -DARDUINO_USB_CDC_ON_BOOT the Cardputer needs it because an S3's
    ;                             native USB leaves Serial on an unwired
    ;                             UART0. This is a classic ESP32 behind an
    ;                             external CH9102 bridge ON UART0, so Serial
    ;                             reaches the host with no flag at all -
    ;                             verified by capturing a boot across a reset.
;
; Bruno compiles its OWN main and nothing of Shepherd's. That is the whole
; point: main.cpp and data.h hold all 16 unguarded ble* calls, so not
; compiling them is what removes the BLE problem - no #ifdef branches through
; twenty sites, and no ble_stub.cpp with nine no-op functions to maintain.
; The parsers it does share (shepherd_frame.h, bruno_frame.h, line_buf.h) are
; header-only, so they arrive by #include rather than through this filter.
build_src_filter = -<*> +<bruno_main.cpp>
extra_scripts = post:scripts/merge_bin.py
lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bblanchon/ArduinoJson @ ^7.0.0

[env:native]
; Off-device tests for the frame parser. The device-side rules must stay in
; step with plugin/shepherd/frame.py, and a board on a desk is the worst
; possible place to discover they have drifted - it needs a flash, a physical
; reset, and gives no assertion output.
;
;   pio test -e native
;
; Needs a host g++. Installed here via:
;   winget install --id BrechtSanders.WinLibs.POSIX.UCRT -e
; winget puts its aliases in %LOCALAPPDATA%\Microsoft\WindowsApps, which an
; already-open shell will not have picked up - start a new one, or add
; %LOCALAPPDATA%\Microsoft\WinGet\Packages\BrechtSanders.WinLibs.*\mingw64in
; to PATH for the session.
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I src
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_src_filter = -<*>
