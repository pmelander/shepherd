# Shepherd — a BLE pocket herd radio for Herdr.
#
# This manifest currently declares the probe-3 skeleton: it exists to answer
# "does a hook-spawned process inherit HERDR_ENV and the caller context vars?"
# The same entrypoint becomes the relay (HerdrSource + BLE central) once that
# is settled.
#
# Interpreter note (verified on this host, 2026-09-05): do NOT use "python3"
# on Windows. It resolves to the Microsoft Store app-execution alias stub,
# which errors with "Python was not found" and tries to open the Store.
# The `py` launcher is the reliable invocation. This is why platforms is
# windows-only for now — the command array is not portable, and claiming
# platforms we have not run on would be a lie the manifest tells.

id = "shepherd"
name = "Shepherd"
version = "0.0.1"
min_herdr_version = "0.8.0"
description = "Per-agent Herdr state on a Cardputer ADV over BLE. Glance, chirp, approve."
platforms = ["windows"]

# Fires when the Herdr session starts. Herdr owns the lifecycle and restarts,
# and failures land in `herdr plugin log list --plugin shepherd`.
[[startup]]
command = ["py", "-3", "start.py", "--mode", "startup"]

# Same entrypoint, invocable on demand. Lets the environment be captured
# without waiting for a server restart, and later becomes the relay restart.
[[actions]]
id = "probe-env"
title = "Shepherd: capture plugin environment"
contexts = ["global"]
command = ["py", "-3", "start.py", "--mode", "action"]
