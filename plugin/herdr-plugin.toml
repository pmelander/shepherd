# Shepherd — a BLE pocket herd radio for Herdr.
#
# The relay: reads the herd, pushes a snapshot to a paired Cardputer ADV over
# Nordic UART, and answers the blocked agent the device says to answer. See
# ../README.md for the security model and the setup order.
#
# Interpreter note (verified on this host, 2026-09-05): do NOT use "python3"
# on Windows. It resolves to the Microsoft Store app-execution alias stub,
# which errors with "Python was not found" and tries to open the Store.
# The `py` launcher is the reliable invocation. This is why platforms is
# windows-only for now — the command array is not portable, and claiming
# platforms we have not run on would be a lie the manifest tells.

id = "shepherd"
name = "Shepherd"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Per-agent Herdr state on a Cardputer ADV over BLE. Glance, chirp, approve."
platforms = ["windows"]

# Fires when the Herdr session starts, and holds the BLE link for as long as
# the session lasts. Failures land in `herdr plugin log list --plugin shepherd`.
#
# Two things make this safe to leave on:
#
#   * The relay takes an OS file lock, so a copy left running by hand does not
#     end up fighting a session-started one for the single Cardputer. The
#     loser exits 0 and says why — a second relay otherwise sits in the
#     reconnect backoff insisting the device is not advertising, which points
#     at the radio instead of at itself.
#
#   * It watches HERDR_SOCKET_PATH and exits when the session ends or is
#     replaced. Herdr does NOT kill plugin startup processes on session stop
#     — verified by stopping a test session and finding the relay still
#     running — so without that, every restart would leave another orphan.
[[startup]]
command = ["py", "-3", "start.py", "--mode", "startup"]

# Bruno, the desk companion. A second startup entry rather than something
# start.py spawns, so a failure in one cannot take the other down.
#
# This costs an install with no Bruno hardware exactly one process start per
# Herdr session and nothing after it. bruno.py's first act is to look for
# `bruno.port` in this plugin's CONFIG directory; absent, it logs one line and
# exits 0 - no retry loop, no log noise, no held port. Creating that file is
# the whole opt-in and deleting it is the whole off switch:
#
#   herdr plugin config-dir shepherd
#   echo COM7 > "%APPDATA%\herdr\plugins\config\shepherd\bruno.port"
#
# An empty file means "find the board yourself".
#
# UNVERIFIED, and worth knowing before debugging something else: whether Herdr
# fires BOTH startup entries. The manifest is documented as array-of-tables,
# so plural is the intended shape, but this has not been run against a live
# session with two entries. If only the first fires, the fallback is for
# start.py to spawn bruno.py as a child when the port file exists - at the
# cost of the isolation above. Confirm with `herdr plugin log list --plugin
# shepherd` after a session start: two processes, two log streams.
[[startup]]
command = ["py", "-3", "bruno.py"]

# Print the PlatformIO flag that pairs this relay's secret with a firmware
# build, generating the secret on first run. An action rather than a README
# paragraph because resolving the config directory by hand is how you end up
# with two secrets and a device whose every action is refused.
[[actions]]
id = "secret-flag"
title = "Shepherd: print the firmware secret flag"
contexts = ["global"]
command = ["py", "-3", "start.py", "--secret-flag"]

# Replace the shared secret without a USB cable. Drops a marker the running
# relay picks up; the relay signs the new key with the old one, waits for the
# device to prove it stored it, and only then writes the new key to disk.
[[actions]]
id = "rotate-key"
title = "Shepherd: rotate the shared secret"
contexts = ["global"]
command = ["py", "-3", "start.py", "--rotate-key"]

# Dump the environment Herdr injects. Kept from bring-up: when the relay
# misbehaves under Herdr but works by hand, the difference is almost always
# in here — HERDR_PLUGIN_CONFIG_DIR and HERDR_PLUGIN_STATE_DIR especially.
[[actions]]
id = "probe-env"
title = "Shepherd: dump plugin environment"
contexts = ["global"]
command = ["py", "-3", "start.py", "--probe-env"]
