# Why this file exists at all: without it, bare `pytest` at the repo root dies
# with
#
#   INTERNALERROR> ... SystemExit: no stick found
#
# and no tests run. The cause is not in tests/ — it is that firmware/tools/
# holds hardware probe SCRIPTS wearing a `test_` prefix. pytest imports every
# `test_*.py` it finds during collection, those scripts call sys.exit() at
# module level when no board is attached, and a SystemExit raised during
# collection takes down the whole session rather than skipping one file.
#
# `testpaths` bounds collection to the directory that actually holds tests, so
# the first command a newcomer types works. The scripts are also being renamed
# to probe_*.py so that no invocation can collect them — belt and braces,
# because testpaths is overridden the moment someone passes an explicit path.
#
# pytest.ini rather than pyproject.toml on purpose: this repo is not an
# installable package (the relay ships through Herdr's plugin channel), and a
# root pyproject.toml invites `pip install .` to be tried and to fail. This
# file can only mean one thing.
[pytest]
testpaths = tests

# The firmware's native suite is a separate runner and is NOT collected here:
#   cd firmware && pio test -e native
